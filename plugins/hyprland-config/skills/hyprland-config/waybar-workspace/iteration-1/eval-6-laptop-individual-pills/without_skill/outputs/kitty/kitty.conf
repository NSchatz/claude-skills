# Kitty Terminal Configuration - Tokyo Night

# ── Font ──
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# ── Cursor ──
cursor_shape beam
cursor_blink_interval 0.5

# ── Scrollback ──
scrollback_lines 10000

# ── Mouse ──
copy_on_select yes
mouse_hide_wait 3.0

# ── Window ──
window_padding_width 10
background_opacity 0.9
confirm_os_window_close 0

# ── Tab Bar ──
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted

# ── Tokyo Night Color Scheme ──
foreground #c0caf5
background #1a1b26
selection_foreground #c0caf5
selection_background #33467c

cursor #c0caf5
cursor_text_color #1a1b26

# Black
color0  #15161e
color8  #414868

# Red
color1  #f7768e
color9  #f7768e

# Green
color2  #9ece6a
color10 #9ece6a

# Yellow
color3  #e0af68
color11 #e0af68

# Blue
color4  #7aa2f7
color12 #7aa2f7

# Magenta
color5  #bb9af7
color13 #bb9af7

# Cyan
color6  #7dcfff
color14 #7dcfff

# White
color7  #a9b1d6
color15 #c0caf5

# Tab bar colors
active_tab_foreground   #1a1b26
active_tab_background   #7aa2f7
inactive_tab_foreground #545c7e
inactive_tab_background #1a1b26
