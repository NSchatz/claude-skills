# ── Hyprlock — Tokyo Night ────────────────────────────────────────────

general {
    hide_cursor = true
    ignore_empty_input = true
}

auth {
    pam:enabled = true
}

# ── Animations ───────────────────────────────────────────────────────
animations {
    enabled = true
}
bezier = easeOut, 0.0, 0.0, 0.2, 1.0
animation = fade, 1, 3, easeOut
animation = inputFieldColors, 1, 2, linear
animation = inputFieldDots, 1, 1, linear
animation = inputFieldFade, 1, 2, easeOut

# ── Background (blurred screenshot) ─────────────────────────────────
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

# ── Clock ────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(192, 202, 245, 1.0)
    font_size = 72
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 250
    halign = center
    valign = center
    shadow_passes = 2
    shadow_color = rgba(0, 0, 0, 0.5)
}

# ── Date ─────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color = rgba(169, 177, 214, 1.0)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 170
    halign = center
    valign = center
}

# ── Greeting ─────────────────────────────────────────────────────────
label {
    monitor =
    text = Hi, $USER
    color = rgba(122, 162, 247, 1.0)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 50
    halign = center
    valign = center
}

# ── Frosted pill behind clock ────────────────────────────────────────
shape {
    monitor =
    size = 400, 120
    color = rgba(26, 27, 38, 0.5)
    rounding = 50
    border_size = 0
    position = 0, 240
    halign = center
    valign = center
    zindex = -1
}

# ── Input field ──────────────────────────────────────────────────────
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 3
    dots_size = 0.3
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1

    outer_color = rgba(122, 162, 247, 1.0)
    inner_color = rgba(26, 27, 38, 0.8)
    font_color = rgba(192, 202, 245, 1.0)
    font_family = JetBrainsMono Nerd Font

    check_color = rgba(255, 158, 100, 1.0) rgba(224, 175, 104, 1.0) 45deg
    fail_color = rgba(247, 118, 142, 1.0) rgba(219, 75, 75, 1.0) 45deg
    capslock_color = rgba(224, 175, 104, 1.0)

    fade_on_empty = true
    fade_timeout = 1500
    placeholder_text = <i>Password...</i>
    rounding = 12

    position = 0, -80
    halign = center
    valign = center
    shadow_passes = 2
}

# ── Fail message ─────────────────────────────────────────────────────
label {
    monitor =
    text = $FAIL <b>($ATTEMPTS[0])</b>
    color = rgba(247, 118, 142, 1.0)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -150
    halign = center
    valign = center
}
