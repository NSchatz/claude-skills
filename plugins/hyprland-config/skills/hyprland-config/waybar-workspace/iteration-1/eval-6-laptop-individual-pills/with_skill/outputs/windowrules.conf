# ── Window rules ─────────────────────────────────────────────────────

# Float + center common dialogs
windowrule {
    name = float-pavucontrol
    match:class = pavucontrol
    float = on
    center = on
}

windowrule {
    name = float-nm-editor
    match:class = nm-connection-editor
    float = on
    center = on
}

windowrule {
    name = float-blueman
    match:class = blueman-manager
    float = on
    center = on
}

windowrule {
    name = float-file-dialog
    match:title = (Open|Save|File|Folder)
    float = on
    center = on
}

# Opacity rules
windowrule {
    name = kitty-opacity
    match:class = kitty
    opacity = 0.92 override 0.85 override
}

# Force opaque for media
windowrule {
    name = opaque-mpv
    match:class = mpv
    opaque = on
}

windowrule {
    name = opaque-firefox-pip
    match:title = Picture-in-Picture
    float = on
    pin = on
}
