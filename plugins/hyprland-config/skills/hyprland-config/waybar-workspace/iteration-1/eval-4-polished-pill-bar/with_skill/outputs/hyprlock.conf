# ── Hyprlock configuration (Catppuccin Mocha) ────────────────────

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
}

bezier = easeOut, 0.0, 0.0, 0.2, 1.0
bezier = linear, 1, 1, 0, 0
animation = fade, 1, 3, easeOut
animation = inputFieldColors, 1, 2, linear
animation = inputFieldDots, 1, 1, linear
animation = inputFieldFade, 1, 2, easeOut

# ── Background (blurred screenshot) ─────────────────────────────
background {
    monitor =
    path = screenshot
    color = rgba(30, 30, 46, 1.0)
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

# ── Frosted pill behind clock ────────────────────────────────────
shape {
    monitor =
    size = 420, 120
    color = rgba(30, 30, 46, 0.5)
    rounding = 60
    border_size = 0
    position = 0, 250
    halign = center
    valign = center
    zindex = -1
}

# ── Clock ────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "<span font_desc='JetBrainsMono Nerd Font Bold 72'>$(date +"%H:%M")</span>"
    color = rgba(205, 214, 244, 1.0)
    font_size = 72
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 250
    halign = center
    valign = center
    shadow_passes = 2
    shadow_color = rgba(0, 0, 0, 0.5)
    shadow_size = 4
}

# ── Date ─────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color = rgba(166, 173, 200, 1.0)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 170
    halign = center
    valign = center
}

# ── Greeting ─────────────────────────────────────────────────────
label {
    monitor =
    text = Hi, $USER
    color = rgba(205, 214, 244, 1.0)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, -30
    halign = center
    valign = center
}

# ── Input field ──────────────────────────────────────────────────
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 3
    dots_size = 0.3
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1

    outer_color = rgba(203, 166, 247, 1.0)
    inner_color = rgba(30, 30, 46, 0.8)
    font_color = rgb(205, 214, 244)
    font_family = JetBrainsMono Nerd Font

    check_color = rgba(250, 179, 135, 1.0) rgba(249, 226, 175, 1.0) 45deg
    fail_color = rgba(243, 139, 168, 1.0) rgba(235, 160, 172, 1.0) 45deg
    capslock_color = rgba(249, 226, 175, 1.0)

    fade_on_empty = true
    fade_timeout = 1500
    placeholder_text = <i>Password...</i>
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    rounding = 12
    swap_font_color = false

    position = 0, -100
    halign = center
    valign = center
    shadow_passes = 2
    shadow_color = rgba(0, 0, 0, 0.4)
    shadow_size = 3
}

# ── Fail attempts label ─────────────────────────────────────────
label {
    monitor =
    text = $FAIL $ATTEMPTS[0]
    color = rgba(243, 139, 168, 1.0)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -170
    halign = center
    valign = center
}
