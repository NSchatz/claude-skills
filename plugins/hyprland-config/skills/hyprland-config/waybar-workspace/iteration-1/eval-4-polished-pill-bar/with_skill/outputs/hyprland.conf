# ── Variables ────────────────────────────────────────────────────
$terminal = kitty
$fileManager = thunar
$menu = wofi --show drun

# ── Source modular configs ───────────────────────────────────────
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/env.conf
source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/windowrules.conf
source = ~/.config/hypr/animations.conf

# ── General ──────────────────────────────────────────────────────
general {
    gaps_in = 5
    gaps_out = 20
    border_size = 2

    col.active_border = rgba(cba6f7ff) rgba(89b4faff) 45deg
    col.inactive_border = rgba(595959aa)

    resize_on_border = true
    layout = dwindle
}

# ── Decoration ───────────────────────────────────────────────────
decoration {
    rounding = 10
    rounding_power = 2.0
    active_opacity = 1.0
    inactive_opacity = 0.9
    fullscreen_opacity = 1.0
    dim_inactive = true
    dim_strength = 0.15

    blur {
        enabled = true
        size = 8
        passes = 3
        noise = 0.0117
        contrast = 0.9
        brightness = 0.8
        vibrancy = 0.17
        vibrancy_darkness = 0.0
        new_optimizations = true
        xray = false
        special = true
    }

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(1a1a1abb)
        color_inactive = rgba(1a1a1a44)
        offset = 0 0
        scale = 1.0
    }
}

# ── Input ────────────────────────────────────────────────────────
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
}

# ── Dwindle layout ───────────────────────────────────────────────
dwindle {
    pseudotile = true
    preserve_split = true
}

# ── Misc ─────────────────────────────────────────────────────────
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    enable_swallow = true
    swallow_regex = ^(kitty)$
    vfr = true
    animate_manual_resizes = true
    focus_on_activate = false
}

# ── Layer rules (blur bars and launchers) ────────────────────────
layerrule = blur true, match:namespace waybar
layerrule = blur true, match:namespace wofi
layerrule = blur true, match:namespace notifications

# ── Smart gaps (no gaps when only one window) ────────────────────
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrule = border_size 0, match:float 0, match:workspace w[tv1]
windowrule = rounding 0, match:float 0, match:workspace w[tv1]
